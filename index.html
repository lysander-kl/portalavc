<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Akademik Sekolah</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
  body { background:#f0f4f8; min-height:100vh; }

  /* LOGIN */
  #loginPage { display:flex; justify-content:center; align-items:center; min-height:100vh;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); }
  .login-box { background:#fff; padding:40px; border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.3); width:100%; max-width:420px; }
  .login-box h1 { text-align:center; color:#333; margin-bottom:8px; font-size:26px; }
  .login-box p.sub { text-align:center; color:#888; margin-bottom:24px; font-size:14px; }
  .login-box label { display:block; margin-bottom:6px; color:#555; font-size:14px; font-weight:600; }
  .login-box input, .login-box select { width:100%; padding:12px; margin-bottom:16px;
    border:2px solid #e0e0e0; border-radius:8px; font-size:14px; transition:border .2s; }
  .login-box input:focus, .login-box select:focus { outline:none; border-color:#667eea; }
  .btn { width:100%; padding:13px; background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600;
    cursor:pointer; transition:transform .15s; }
  .btn:hover { transform:translateY(-2px); }
  .btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .btn-sm { padding:8px 14px; font-size:13px; width:auto; }
  .demo-info { margin-top:20px; padding:14px; background:#f8f9ff;
    border-left:4px solid #667eea; border-radius:6px; font-size:12px; color:#555; line-height:1.7; }
  .demo-info b { color:#667eea; }
  .error { color:#e74c3c; font-size:13px; margin-bottom:12px; display:none; }
  .loading { text-align:center; color:#667eea; font-size:13px; margin-top:12px; display:none; }

  /* DASHBOARD */
  #app { display:none; }
  .sidebar { position:fixed; left:0; top:0; bottom:0; width:250px;
    background:#1e293b; color:#cbd5e1; padding:24px 0; overflow-y:auto; }
  .sidebar h2 { color:#fff; font-size:18px; padding:0 24px 20px;
    border-bottom:1px solid #334155; margin-bottom:16px; }
  .sidebar h2 span { color:#667eea; }
  .user-info { padding:14px 24px; margin:0 16px 16px; background:#0f172a;
    border-radius:8px; font-size:13px; }
  .user-info .name { color:#fff; font-weight:600; font-size:14px; }
  .user-info .role { color:#667eea; text-transform:uppercase; font-size:11px; letter-spacing:1px; }
  .nav-item { padding:12px 24px; cursor:pointer; display:flex; align-items:center;
    gap:12px; font-size:14px; transition:background .2s; border-left:3px solid transparent; }
  .nav-item:hover { background:#334155; color:#fff; }
  .nav-item.active { background:#334155; color:#fff; border-left-color:#667eea; }
  .nav-item .icon { font-size:18px; }

  .main { margin-left:250px; padding:30px 40px; min-height:100vh; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
  .topbar h1 { color:#1e293b; font-size:26px; }
  .logout-btn { padding:10px 18px; background:#ef4444; color:#fff; border:none;
    border-radius:8px; cursor:pointer; font-weight:600; font-size:13px; }
  .logout-btn:hover { background:#dc2626; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px; margin-bottom:30px; }
  .stat-card { background:#fff; padding:22px; border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06); border-left:4px solid #667eea; }
  .stat-card h3 { color:#64748b; font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:.5px; }
  .stat-card .value { color:#1e293b; font-size:32px; font-weight:700; margin-top:8px; }
  .stat-card.green { border-left-color:#10b981; }
  .stat-card.orange { border-left-color:#f59e0b; }
  .stat-card.red { border-left-color:#ef4444; }

  .card { background:#fff; border-radius:12px; padding:24px;
    box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:24px; }
  .card h2 { color:#1e293b; font-size:18px; margin-bottom:18px;
    padding-bottom:12px; border-bottom:2px solid #f1f5f9; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; padding:12px; background:#f8fafc; color:#475569;
    font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  td { padding:12px; border-bottom:1px solid #f1f5f9; color:#334155; }
  tr:hover td { background:#f8fafc; }

  .badge { padding:4px 10px; border-radius:20px; font-size:11px;
    font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
  .badge-success { background:#d1fae5; color:#065f46; }
  .badge-warn { background:#fef3c7; color:#92400e; }
  .badge-danger { background:#fee2e2; color:#991b1b; }
  .badge-info { background:#dbeafe; color:#1e40af; }

  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; color:#475569; margin-bottom:6px; font-weight:600; }
  .form-group input, .form-group select, .form-group textarea {
    width:100%; padding:10px; border:2px solid #e2e8f0; border-radius:8px; font-size:14px; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none; border-color:#667eea; }

  .btn-primary { padding:11px 22px; background:#667eea; color:#fff; border:none;
    border-radius:8px; cursor:pointer; font-weight:600; font-size:14px; }
  .btn-primary:hover { background:#5568d3; }
  .btn-danger { background:#ef4444; }
  .btn-danger:hover { background:#dc2626; }
  .btn-warning { background:#f59e0b; }
  .btn-warning:hover { background:#d97706; }
  .btn-secondary { background:#94a3b8; }
  .btn-secondary:hover { background:#64748b; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
    justify-content:center; align-items:center; z-index:1000; padding:20px; }
  .modal.show { display:flex; }
  .modal-content { background:#fff; border-radius:12px; padding:30px;
    width:100%; max-width:500px; max-height:90vh; overflow-y:auto; }
  .modal-content h2 { margin-bottom:20px; color:#1e293b; }

  .toast { position:fixed; top:20px; right:20px; background:#10b981; color:#fff;
    padding:14px 20px; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.15);
    z-index:2000; display:none; font-size:14px; font-weight:500; }
  .toast.error { background:#ef4444; }

  @media (max-width:768px) {
    .sidebar { width:200px; transform:translateX(-100%); transition:transform .3s; z-index:999; }
    .sidebar.show { transform:translateX(0); }
    .main { margin-left:0; padding:20px; }
    .form-row { grid-template-columns:1fr; }
    .menu-toggle { display:block !important; }
  }
  .menu-toggle { display:none; background:#667eea; color:#fff; border:none;
    padding:10px 14px; border-radius:8px; cursor:pointer; margin-bottom:15px; }
</style>
</head>
<body>

<!-- ============ HALAMAN LOGIN ============ -->
<div id="loginPage">
  <div class="login-box">
    <h1>🎓 Portal Akademik</h1>
    <p class="sub">Sistem Informasi Sekolah Terpadu</p>
    <div class="error" id="loginError"></div>
    <label>Pilih Role</label>
    <select id="loginRole">
      <option value="admin">Admin</option>
      <option value="guru">Guru</option>
      <option value="siswa">Siswa</option>
      <option value="orangtua">Orang Tua</option>
    </select>
    <label>Username</label>
    <input type="text" id="loginUser" placeholder="Masukkan username" autocomplete="username">
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="Masukkan password" autocomplete="current-password">
    <button class="btn" id="btnLogin" onclick="doLogin()">Login</button>
    <div class="loading" id="loginLoading">⏳ Memverifikasi...</div>
    <div class="demo-info">
      <b>Akun Demo:</b><br>
      Admin: <b>admin</b> / admin123<br>
      Guru: <b>budi</b> / guru123<br>
      Siswa: <b>andi</b> / siswa123<br>
      Ortu: <b>ortuandi</b> / ortu123
    </div>
  </div>
</div>

<!-- ============ APLIKASI ============ -->
<div id="app">
  <div class="sidebar" id="sidebar">
    <h2>🎓 <span>Portal</span> Akademik</h2>
    <div class="user-info">
      <div class="name" id="sideName">-</div>
      <div class="role" id="sideRole">-</div>
    </div>
    <div id="navMenu"></div>
  </div>
  <div class="main">
    <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('show')">☰ Menu</button>
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- ============ MODAL & TOAST ============ -->
<div class="modal" id="modal"><div class="modal-content" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
 *  STATE GLOBAL
 * ============================================================ */
let currentUser = null;
let DB = { users: [], tugas: [], nilai: [], absensi: [], pengumuman: [] };
let currentPage = 'dashboard';

/* ============================================================
 *  UTIL
 * ============================================================ */
function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function showLoading(show) {
  document.getElementById('loginLoading').style.display = show ? 'block' : 'none';
  document.getElementById('btnLogin').disabled = show;
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

/* ============================================================
 *  LOGIN / LOGOUT
 * ============================================================ */
function doLogin() {
  const role = document.getElementById('loginRole').value;
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');

  if (!u || !p) { err.textContent = 'Username & password wajib diisi!'; err.style.display = 'block'; return; }

  err.style.display = 'none';
  showLoading(true);

  google.script.run
    .withSuccessHandler(res => {
      showLoading(false);
      if (!res.ok) { err.textContent = res.message; err.style.display = 'block'; return; }
      currentUser = res.user;
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      // ambil data master, lalu init dashboard
      loadAllData(() => initDashboard());
    })
    .withFailureHandler(e => {
      showLoading(false);
      err.textContent = 'Gagal koneksi ke server: ' + e.message;
      err.style.display = 'block';
    })
    .apiLogin(role, u, p);
}

function doLogout() {
  if (!confirm('Yakin logout?')) return;
  currentUser = null;
  DB = { users: [], tugas: [], nilai: [], absensi: [], pengumuman: [] };
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

function loadAllData(callback) {
  google.script.run
    .withSuccessHandler(res => {
      if (res.ok) DB = res.data;
      else toast('Gagal memuat data: ' + res.message, true);
      if (callback) callback();
    })
    .withFailureHandler(e => {
      toast('Gagal memuat data: ' + e.message, true);
      if (callback) callback();
    })
    .apiGetAll();
}

/* ============================================================
 *  DASHBOARD INIT
 * ============================================================ */
const MENUS = {
  admin: [
    { id:'dashboard',  label:'Dashboard',       icon:'🏠' },
    { id:'users',      label:'Manajemen User',  icon:'👥' },
    { id:'tugas',      label:'Tugas',           icon:'📝' },
    { id:'nilai',      label:'Nilai',           icon:'📊' },
    { id:'absensi',    label:'Absensi',         icon:'📅' },
    { id:'pengumuman', label:'Pengumuman',      icon:'📢' },
  ],
  guru: [
    { id:'dashboard',  label:'Dashboard',       icon:'🏠' },
    { id:'tugas',      label:'Kelola Tugas',    icon:'📝' },
    { id:'nilai',      label:'Input Nilai',     icon:'📊' },
    { id:'absensi',    label:'Absensi',         icon:'📅' },
    { id:'siswa',      label:'Data Siswa',      icon:'👨‍🎓' },
  ],
  siswa: [
    { id:'dashboard',  label:'Dashboard',       icon:'🏠' },
    { id:'tugas',      label:'Tugas Saya',      icon:'📝' },
    { id:'nilai',      label:'Nilai Saya',      icon:'📊' },
    { id:'absensi',    label:'Absensi Saya',    icon:'📅' },
    { id:'pengumuman', label:'Pengumuman',      icon:'📢' },
  ],
  orangtua: [
    { id:'dashboard',  label:'Dashboard',       icon:'🏠' },
    { id:'nilai',      label:'Nilai Anak',      icon:'📊' },
    { id:'absensi',    label:'Absensi Anak',    icon:'📅' },
    { id:'tugas',      label:'Tugas Anak',      icon:'📝' },
    { id:'pengumuman', label:'Pengumuman',      icon:'📢' },
  ],
};

function initDashboard() {
  document.getElementById('sideName').textContent = currentUser.name;
  document.getElementById('sideRole').textContent = currentUser.role;
  document.getElementById('navMenu').innerHTML = MENUS[currentUser.role].map(m =>
    `<div class="nav-item" data-page="${m.id}" onclick="navigate('${m.id}')">
      <span class="icon">${m.icon}</span>${m.label}</div>`
  ).join('');
  navigate('dashboard');
}

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.page === page));
  document.getElementById('sidebar').classList.remove('show');
  const titles = {
    dashboard:'Dashboard', users:'Manajemen User', tugas:'Tugas',
    nilai:'Nilai', absensi:'Absensi', pengumuman:'Pengumuman', siswa:'Data Siswa'
  };
  document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';
  document.getElementById('content').innerHTML = renderPage(page);
}

/* ============================================================
 *  RENDER PAGES
 * ============================================================ */
function renderPage(page) {
  switch(page) {
    case 'dashboard':  return renderDashboard();
    case 'users':      return renderUsers();
    case 'tugas':      return renderTugas();
    case 'nilai':      return renderNilai();
    case 'absensi':    return renderAbsensi();
    case 'pengumuman': return renderPengumuman();
    case 'siswa':      return renderSiswa();
    default: return '<p>Halaman tidak ditemukan</p>';
  }
}

function renderDashboard() {
  const role = currentUser.role;
  if (role === 'admin') {
    return `
      <div class="stats">
        <div class="stat-card"><h3>Total User</h3><div class="value">${DB.users.length}</div></div>
        <div class="stat-card green"><h3>Total Tugas</h3><div class="value">${DB.tugas.length}</div></div>
        <div class="stat-card orange"><h3>Data Nilai</h3><div class="value">${DB.nilai.length}</div></div>
        <div class="stat-card red"><h3>Absensi</h3><div class="value">${DB.absensi.length}</div></div>
      </div>
      <div class="card"><h2>📢 Pengumuman Terbaru</h2>
        ${DB.pengumuman.map(p=>`<div style="padding:12px 0;border-bottom:1px solid #f1f5f9">
          <b>${p.judul}</b> <span style="color:#94a3b8;font-size:12px">(${p.tanggal})</span>
          <div style="color:#64748b;font-size:14px;margin-top:4px">${p.isi}</div></div>`).join('')}
      </div>`;
  }
  if (role === 'guru') {
    const kelasArr = currentUser.kelas || [];
    return `
      <div class="stats">
        <div class="stat-card"><h3>Kelas Diampu</h3><div class="value">${kelasArr.length}</div></div>
        <div class="stat-card green"><h3>Tugas Dibuat</h3><div class="value">${DB.tugas.filter(t=>t.guru===currentUser.name).length}</div></div>
        <div class="stat-card orange"><h3>Total Siswa</h3><div class="value">${DB.users.filter(u=>u.role==='siswa').length}</div></div>
      </div>
      <div class="card"><h2>👨‍🏫 Kelas Yang Diampu</h2>
        <table><tr><th>No</th><th>Kelas</th><th>Jumlah Tugas</th></tr>
        ${kelasArr.map((k,i)=>`<tr><td>${i+1}</td><td><b>${k}</b></td>
          <td>${DB.tugas.filter(t=>t.kelas===k).length}</td></tr>`).join('')}
        </table>
      </div>`;
  }
  if (role === 'siswa') {
    const nilaiSaya = DB.nilai.filter(n=>n.siswaId===currentUser.id);
    const rata = nilaiSaya.length ? (nilaiSaya.reduce((a,b)=>a+Number(b.nilai),0)/nilaiSaya.length).toFixed(1) : 0;
    const hadir = DB.absensi.filter(a=>a.siswaId===currentUser.id && a.status==='Hadir').length;
    const totalAbsen = DB.absensi.filter(a=>a.siswaId===currentUser.id).length;
    return `
      <div class="stats">
        <div class="stat-card"><h3>Rata-rata Nilai</h3><div class="value">${rata}</div></div>
        <div class="stat-card green"><h3>Kehadiran</h3><div class="value">${hadir}/${totalAbsen}</div></div>
        <div class="stat-card orange"><h3>Tugas</h3><div class="value">${DB.tugas.filter(t=>t.kelas===currentUser.kelas).length}</div></div>
      </div>
      <div class="card"><h2>👤 Info Siswa</h2>
        <p style="line-height:2;color:#475569">
          <b>Nama:</b> ${currentUser.name}<br>
          <b>NIS:</b> ${currentUser.nis}<br>
          <b>Kelas:</b> ${currentUser.kelas}
        </p></div>`;
  }
  if (role === 'orangtua') {
    const anak = DB.users.find(u=>u.id===currentUser.anakId);
    if (!anak) return '<div class="card"><h2>Data anak tidak ditemukan</h2></div>';
    const nilaiAnak = DB.nilai.filter(n=>n.siswaId===anak.id);
    const rata = nilaiAnak.length ? (nilaiAnak.reduce((a,b)=>a+Number(b.nilai),0)/nilaiAnak.length).toFixed(1) : 0;
    const hadir = DB.absensi.filter(a=>a.siswaId===anak.id && a.status==='Hadir').length;
    return `
      <div class="stats">
        <div class="stat-card"><h3>Nama Anak</h3><div class="value" style="font-size:20px">${anak.name}</div></div>
        <div class="stat-card green"><h3>Rata-rata Nilai</h3><div class="value">${rata}</div></div>
        <div class="stat-card orange"><h3>Kehadiran</h3><div class="value">${hadir}</div></div>
      </div>
      <div class="card"><h2>👨‍👩‍👦 Informasi Anak</h2>
        <p style="line-height:2;color:#475569">
          <b>Nama:</b> ${anak.name}<br><b>NIS:</b> ${anak.nis}<br><b>Kelas:</b> ${anak.kelas}
        </p></div>`;
  }
}

function renderUsers() {
  return `<div class="card"><h2>👥 Manajemen User</h2>
    <table><tr><th>No</th><th>Nama</th><th>Username</th><th>Role</th><th>Info</th></tr>
    ${DB.users.map((u,i)=>`<tr>
      <td>${i+1}</td><td><b>${u.name}</b></td><td>${u.username}</td>
      <td><span class="badge badge-info">${u.role}</span></td>
      <td>${u.kelas && u.kelas.length ? 'Kelas: '+(Array.isArray(u.kelas)?u.kelas.join(', '):u.kelas) :
            u.nis ? 'NIS: '+u.nis : u.anakId ? 'Anak dari user ID '+u.anakId : '-'}</td>
    </tr>`).join('')}</table></div>`;
}

/* ============ TUGAS ============ */
function renderTugas() {
  const role = currentUser.role;
  let list = DB.tugas;
  if (role === 'siswa') list = DB.tugas.filter(t=>t.kelas===currentUser.kelas);
  else if (role === 'guru') list = DB.tugas.filter(t=>t.guru===currentUser.name);
  else if (role === 'orangtua') {
    const anak = DB.users.find(u=>u.id===currentUser.anakId);
    list = anak ? DB.tugas.filter(t=>t.kelas===anak.kelas) : [];
  }
  const canEdit = role === 'guru' || role === 'admin';
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="border:none;padding:0;margin:0">📝 Daftar Tugas</h2>
      ${canEdit ? '<button class="btn-primary" onclick="showAddTugas()">+ Tambah Tugas</button>' : ''}
    </div>
    <table><tr><th>No</th><th>Judul</th><th>Mapel</th><th>Kelas</th><th>Deadline</th><th>Guru</th>${canEdit?'<th>Aksi</th>':''}</tr>
    ${list.length===0 ? '<tr><td colspan="7" style="text-align:center;color:#94a3b8">Belum ada tugas</td></tr>' :
      list.map((t,i)=>`<tr>
        <td>${i+1}</td><td><b>${t.judul}</b></td><td>${t.mapel}</td>
        <td><span class="badge badge-info">${t.kelas}</span></td>
        <td>${t.deadline||'-'}</td><td>${t.guru}</td>
        ${canEdit?`<td>
          <button class="btn-sm btn-warning" onclick="editTugas(${t.id})">Edit</button>
          <button class="btn-sm btn-danger" onclick="hapusTugas(${t.id})">Hapus</button>
        </td>`:''}</tr>`).join('')}</table></div>`;
}

function showAddTugas() {
  const kelas = currentUser.role === 'guru'
    ? currentUser.kelas
    : ['X-IPA-1','X-IPA-2','X-IPS-1','XI-IPA-1','XI-IPS-1'];
  document.getElementById('modalContent').innerHTML = `
    <h2>Tambah Tugas</h2>
    <div class="form-group"><label>Judul</label><input id="tJudul"></div><br>
    <div class="form-group"><label>Mata Pelajaran</label><input id="tMapel"></div><br>
    <div class="form-row">
      <div class="form-group"><label>Kelas</label>
        <select id="tKelas">${kelas.map(k=>`<option>${k}</option>`).join('')}</select></div>
      <div class="form-group"><label>Deadline</label><input type="date" id="tDeadline"></div>
    </div>
    <div class="form-group"><label>Deskripsi</label><textarea id="tDesc" rows="3"></textarea></div><br>
    <button class="btn-primary" onclick="simpanTugas()">Simpan</button>
    <button class="btn-primary btn-secondary" onclick="closeModal()">Batal</button>`;
  document.getElementById('modal').classList.add('show');
}

function simpanTugas() {
  const judul = document.getElementById('tJudul').value.trim();
  const mapel = document.getElementById('tMapel').value.trim();
  if (!judul || !mapel) { toast('Judul dan mapel wajib diisi!', true); return; }
  const tugas = {
    judul, mapel,
    kelas: document.getElementById('tKelas').value,
    deadline: document.getElementById('tDeadline').value || '-',
    deskripsi: document.getElementById('tDesc').value,
    guru: currentUser.name
  };
  google.script.run
    .withSuccessHandler(res => {
      if (res.ok) { toast(res.message); loadAllData(() => { closeModal(); navigate('tugas'); }); }
      else toast(res.message, true);
    })
    .withFailureHandler(e => toast('Error: ' + e.message, true))
    .apiAddTugas(tugas);
}

function editTugas(id) {
  const t = DB.tugas.find(x=>Number(x.id)===Number(id));
  if (!t) return;
  const kelas = currentUser.role === 'guru'
    ? currentUser.kelas
    : ['X-IPA-1','X-IPA-2','X-IPS-1','XI-IPA-1','XI-IPS-1'];
  document.getElementById('modalContent').innerHTML = `
    <h2>Edit Tugas</h2>
    <div class="form-group"><label>Judul</label><input id="tJudul" value="${t.judul}"></div><br>
    <div class="form-group"><label>Mata Pelajaran</label><input id="tMapel" value="${t.mapel}"></div><br>
    <div class="form-row">
      <div class="form-group"><label>Kelas</label>
        <select id="tKelas">${kelas.map(k=>`<option ${k===t.kelas?'selected':''}>${k}</option>`).join('')}</select></div>
      <div class="form-group"><label>Deadline</label><input type="date" id="tDeadline" value="${t.deadline}"></div>
    </div>
    <div class="form-group"><label>Deskripsi</label><textarea id="tDesc" rows="3">${t.deskripsi||''}</textarea></div><br>
    <button class="btn-primary" onclick="updateTugas(${id})">Update</button>
    <button class="btn-primary btn-secondary" onclick="closeModal()">Batal</button>`;
  document.getElementById('modal').classList.add('show');
}

function updateTugas(id) {
  const tugas = {
    id,
    judul: document.getElementById('tJudul').value,
    mapel: document.getElementById('tMapel').value,
    kelas: document.getElementById('tKelas').value,
    deadline: document.getElementById('tDeadline').value,
    deskripsi: document.getElementById('tDesc').value,
    guru: currentUser.name
  };
  google.script.run
    .withSuccessHandler(res => {
      if (res.ok) { toast(res.message); loadAllData(() => { closeModal(); navigate('tugas'); }); }
      else toast(res.message, true);
    })
    .withFailureHandler(e => toast('Error: ' + e.message, true))
    .apiUpdateTugas(tugas);
}

function hapusTugas(id) {
  if (!confirm('Yakin hapus tugas ini?')) return;
  google.script.run
    .withSuccessHandler(res => {
      if (res.ok) { toast(res.message); loadAllData(() => navigate('tugas')); }
      else toast(res.message, true);
    })
    .withFailureHandler(e => toast('Error: ' + e.message, true))
    .apiDeleteTugas(id);
}

/* ============ NILAI ============ */
function renderNilai() {
  const role = currentUser.role;
  let list = DB.nilai;
  if (role === 'siswa') list = DB.nilai.filter(n=>Number(n.siswaId)===currentUser.id);
  else if (role === 'orangtua') list = DB.nilai.filter(n=>Number(n.siswaId)===currentUser.anakId);
  const canEdit = role === 'guru' || role === 'admin';
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="border:none;padding:0;margin:0">📊 Data Nilai</h2>
      ${canEdit ? '<button class="btn-primary" onclick="showAddNilai()">+ Input Nilai</button>' : ''}
    </div>
    <table><tr><th>No</th><th>Nama Siswa</th><th>Mapel</th><th>Jenis</th><th>Nilai</th><th>Keterangan</th>${canEdit?'<th>Aksi</th>':''}</tr>
    ${list.length===0 ? '<tr><td colspan="7" style="text-align:center;color:#94a3b8">Belum ada data nilai</td></tr>' :
      list.map((n,i)=>{
        const siswa = DB.users.find(u=>u.id===Number(n.siswaId));
        const val = Number(n.nilai);
        let badge='badge-info', ket='Baik';
        if (val>=85) { badge='badge-success'; ket='Sangat Baik'; }
        else if (val>=75) { badge='badge-info'; ket='Baik'; }
        else if (val>=65) { badge='badge-warn'; ket='Cukup'; }
        else { badge='badge-danger'; ket='Kurang'; }
        return `<tr><td>${i+1}</td><td>${siswa?siswa.name:'-'}</td><td>${n.mapel}</td>
          <td>${n.jenis}</td><td><b>${val}</b></td>
          <td><span class="badge ${badge}">${ket}</span></td>
          ${canEdit?`<td><button class="btn-sm btn-danger" onclick="hapusNilai(${n.id})">Hapus</button></td>`:''}
        </tr>`;
      }).join('')}</table></div>`;
}

function showAddNilai() {
  const siswas = DB.users.filter(u=>u.role==='siswa');
  document.getElementById('modalContent').innerHTML = `
    <h2>Input Nilai</h2>
    <div class="form-group"><label>Siswa</label>
      <select id="nSiswa">${siswas.map(s=>`<option value="${s.id}">${s.name} (${s.kelas})</option>`).join('')}</select></div><br>
    <div class="form-row">
      <div class="form-group"><label>Mata Pelajaran</label><input id="nMapel"></div>
      <div class="form-group"><label>Jenis</label>
        <select id="nJenis"><option>UTS</option><option>UAS</option><option>Tugas</option><option>Harian</option></select></div>
    </div>
    <div class="form-group"><label>Nilai (0-100)</label><input type="number" id="nNilai" min="0" max="100"></div><br>
    <button class="btn-primary" onclick="simpanNilai()">Simpan</button>
    <button class="btn-primary btn-secondary" onclick="closeModal()">Batal</button>`;
  document.getElementById('modal').classList.add('show');
}

function simpanNilai() {
  const nilai = parseInt(document.getElementById('nNilai').value);
  if (isNaN(nilai) || nilai < 0 || nilai > 100) { toast('Nilai harus 0-100!', true); return; }
  const data = {
    siswaId: parseInt(document.getElementById('nSiswa').value),
    mapel: document.getElementById('nMapel').value,
    jenis: document.getElementById('nJenis').value,
    nilai
  };
  google.script.run
    .withSuccessHandler(res => {
      if (res.ok) { toast(res.message); loadAllData(() => { closeModal(); navigate('nilai'); }); }
      else toast(res.message, true);
    })
    .withFailureHandler(e => toast('Error: ' + e.message, true))
    .apiAddNilai(data);
}

function hapusNilai(id) {
  if (!confirm('Hapus nilai ini?')) return;
  google.script.run
    .withSuccessHandler(res => {
      if (res.ok) { toast(res.message); loadAllData(() => navigate('nilai')); }
      else toast(res.message, true);
    })
    .withFailureHandler(e => toast('Error: ' + e.message, true))
    .apiDeleteNilai(id);
}

/* ============ ABSENSI ============ */
function renderAbsensi() {
  const role = currentUser.role;
  let list = DB.absensi;
  if (role === 'siswa') list = DB.absensi.filter(a=>Number(a.siswaId)===currentUser.id);
  else if (role === 'orangtua') list = DB.absensi.filter(a=>Number(a.siswaId)===currentUser.anakId);
  const canEdit = role === 'guru' || role === 'admin';
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="border:none;padding:0;margin:0">📅 Data Absensi</h2>
      ${canEdit ? '<button class="btn-primary" onclick="showAddAbsensi()">+ Input Absensi</button>' : ''}
    </div>
    <table><tr><th>No</th><th>Nama</th><th>Tanggal</th><th>Mapel</th><th>Status</th>${canEdit?'<th>Aksi</th>':''}</tr>
    ${list.length===0 ? '<tr><td colspan="6" style="text-align:center;color:#94a3b8">Belum ada data absensi</td></tr>' :
      list.map((a,i)=>{
        const siswa = DB.users.find(u=>u.id===Number(a.siswaId));
        const badge = a.status==='Hadir'?'badge-success':a.status==='Izin'?'badge-warn':'badge-danger';
        return `<tr><td>${i+1}</td><td>${siswa?siswa.name:'-'}</td><td>${a.tanggal}</td>
          <td>${a.mapel||'-'}</td><td><span class="badge ${badge}">${a.status}</span></td>
          ${canEdit?`<td><button class="btn-sm btn-danger" onclick="hapusAbsensi(${a.id})">Hapus</button></td>`:''}
        </tr>`;
      }).join('')}</table></div>`;
}

function showAddAbsensi() {
  const siswas = DB.users.filter(u=>u.role==='siswa');
  document.getElementById('modalContent').innerHTML = `
    <h2>Input Absensi</h2>
    <div class="form-group"><label>Siswa</label>
      <select id="aSiswa">${siswas.map(s=>`<option value="${s.id}">${s.name} (${s.kelas})</option>`).join('')}</select></div><br>
    <div class="form-row">
      <div class="form-group"><label>Tanggal</label><input type="date" id="aTanggal"></div>
      <div class="form-group"><label>Status</label>
        <select id="aStatus"><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alfa</option></select></div>
    </div>
    <div class="form-group"><label>Mata Pelajaran</label><input id="aMapel"></div><br>
    <button class="btn-primary" onclick="simpanAbsensi()">Simpan</button>
    <button class="btn-primary btn-secondary" onclick="closeModal()">Batal</button>`;
  document.getElementById('modal').classList.add('show');
}

function simpanAbsensi() {
  const data = {
    siswaId: parseInt(document.getElementById('aSiswa').value),
    tanggal: document.getElementById('aTanggal').value,
    status: document.getElementById('aStatus').value,
    mapel: document.getElementById('aMapel').value
  };
  if (!data.tanggal) { toast('Tanggal wajib diisi!', true); return; }
  google.script.run
    .withSuccessHandler(res => {
      if (res.ok) { toast(res.message); loadAllData(() => { closeModal(); navigate('absensi'); }); }
      else toast(res.message, true);
    })
    .withFailureHandler(e => toast('Error: ' + e.message, true))
    .apiAddAbsensi(data);
}

function hapusAbsensi(id) {
  if (!confirm('Hapus data absensi ini?')) return;
  google.script.run
    .withSuccessHandler(res => {
      if (res.ok) { toast(res.message); loadAllData(() => navigate('absensi')); }
      else toast(res.message, true);
    })
    .withFailureHandler(e => toast('Error: ' + e.message, true))
    .apiDeleteAbsensi(id);
}

/* ============ PENGUMUMAN ============ */

  return `<div class="card"><h2>📢 Pengumuman Sekolah</h2>

      <div style="padding:16px 0;border-bottom:1px solid #f1f5f9">

        <div style="color:#64748b;margin-bottom:6px">${p.isi}</div>
        <div style="color:#94a3b8;font-size:12px">📅 ${p.tanggal}</div>

}

/* ============ SISWA (GURU) ============ */
function renderSiswa() {
  const kelasArr = currentUser.kelas || [];
  const siswas = DB.users.filter(u => u.role === 'siswa' && kelasArr.includes(u.kelas));
  return `<div class="card"><h2>👨‍🎓 Data Siswa</h2>
    <table><tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th></tr>
    ${siswas.map((s,i)=>`<tr><td>${i+1}</td><td>${s.nis}</td>
      <td><b>${s.name}</b></td><td><span class="badge badge-info">${s.kelas}</span></td></tr>`).join('')}
    </table></div>`;
}
